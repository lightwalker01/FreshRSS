name: Publish FreshRSS marketplace preview

on:
  push:
    branches:
      - preview/marketplace-pr-2
  workflow_dispatch:

# To ensure that if the latest push finishes faster than an earlier run, the previous run won't
# overwrite it later. (by queueing the runs)
env:
  PREVIEW_COMMIT: eb3bcf7be772e70fd6f8c6fa441d48ba3520519c

concurrency:
  group: docker-publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-container-image:
    if: github.ref == 'refs/heads/preview/marketplace-pr-2'
    name: Build Docker image ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # For uploading to the GitHub container registry (ghcr.io)
    strategy:
      matrix:
        include:
          - name: Debian
            file: Docker/Dockerfile
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.PREVIEW_COMMIT }}
        persist-credentials: false

    - name: Get FreshRSS version
      run: |
        FRESHRSS_VERSION=$(sed -n "s/^const FRESHRSS_VERSION = '\(.*\)'.*$/\1/p" constants.php)
        echo "$FRESHRSS_VERSION"
        echo "FRESHRSS_VERSION=$FRESHRSS_VERSION" >> $GITHUB_ENV

    - name: Allow writes to the extensions volume
      run: printf '\nRUN chmod g+w /var/www/FreshRSS/extensions\n' >> Docker/Dockerfile

    - name: Add metadata to Docker images
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        flavor: latest=false
        images: ghcr.io/${{ github.repository_owner }}/freshrss-preview
        tags: type=raw,value=pr-2-eb3bcf7be
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ env.PREVIEW_COMMIT }}
          org.opencontainers.image.url=https://freshrss.org/
          org.opencontainers.image.version=${{ env.FRESHRSS_VERSION }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker images
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: . # Switching from git context to path context, needed for .dockerignore to be applied. See: https://github.com/docker/build-push-action#git-context
        file: ${{ matrix.file }}
        platforms: linux/amd64,linux/arm/v7,linux/arm64
        build-args: |
          FRESHRSS_VERSION=${{ env.FRESHRSS_VERSION }}
          SOURCE_COMMIT=${{ env.PREVIEW_COMMIT }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        push: true
        provenance: mode=max
        sbom: true
